# Alembic configuration.
#
# The database URL is deliberately NOT set here: env.py reads it from
# app.core.config (SAMPLEFORGE_DATABASE_URL, or .env), so migrations always
# target the same database the application uses. This placeholder exists only
# because Alembic requires the key to be present.

[alembic]
script_location = alembic
prepend_sys_path = .
# Revision files are named <rev>_<slug>.py so the first one sorts as 0001.
file_template = %%(rev)s_%%(slug)s
timezone = UTC
# Reject unknown keys in alembic.ini rather than silently ignoring a typo.
truncate_slug_length = 40

[post_write_hooks]
# Nothing here by default. `ruff format` runs over the tree via `make lint`, so
# generated revisions match hand-written ones without a hook.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
